# ~/.config/kitty/kitty.conf

# =============================================================================
# Remote control disabled — each Kitty window is independent
# =============================================================================
allow_remote_control  no

# Ensure Homebrew/tools are available in GUI-launched shells
env PATH=${HOME}/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

# =============================================================================
# Font
# =============================================================================
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        14.0

# =============================================================================
# Window / Appearance
# =============================================================================
window_padding_width       8
single_window_padding_width -1
window_border_width        0.5
window_margin_width        0
draw_minimal_borders       yes
draw_window_borders_for_single_window no
single_window_margin_width -1
hide_window_decorations    no
confirm_os_window_close    0
remember_window_size       no
remember_window_position   no
enabled_layouts            tall,fat,horizontal,vertical,splits
placement_strategy         center
resize_debounce_time       0.05 0.05
window_resize_step_cells   1
window_resize_step_lines   1
initial_window_width       120c
initial_window_height      45c
# Background transparency
background_opacity         0.85

# Background image
# background_image        ~/Pictures/background.png   # personal asset, not shipped
background_image_layout   cscaled
background_tint           0.2

# =============================================================================
# Cursor
# =============================================================================
cursor_shape                  block
cursor_shape_unfocused        hollow
cursor_blink_interval         0
cursor_beam_thickness         1.5
cursor_underline_thickness    2.0

# =============================================================================
# Mouse
# =============================================================================
mouse_hide_wait           3.0
focus_follows_mouse       no

click_interval            0.5
select_by_word_characters :@-./_~?&=%+#
wheel_scroll_multiplier   5.0
touch_scroll_multiplier   1.0

url_style                 curly
url_prefixes              file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh

detect_urls               yes
underline_hyperlinks      hover
pointer_shape_when_grabbed arrow

# Mouse selection
mouse_map left               press   ungrabbed                mouse_selection normal
mouse_map left               doublepress ungrabbed            mouse_selection word
mouse_map left               triplepress ungrabbed            mouse_selection line
mouse_map right              press   ungrabbed                paste_selection_or_clipboard
mouse_map shift+left         press   grabbed,ungrabbed        mouse_selection normal
mouse_map shift+left         doublepress grabbed,ungrabbed    mouse_selection word
mouse_map shift+left         triplepress grabbed,ungrabbed    mouse_selection line

# =============================================================================
# Scrollback
# =============================================================================
scrollback_lines          100000
scrollback_pager          bash -c "col -bx | bat --paging=always --style=plain -l ansi"
pixel_scroll              yes

# =============================================================================
# Bell
# =============================================================================
visual_bell_duration      0.15
visual_bell_color         #f6c177
enable_audio_bell         no
window_alert_on_bell      yes
bell_on_tab               "🔔 "
macos_dock_badge_on_bell  yes

# =============================================================================
# Marks
# =============================================================================
mark1_foreground #191724
mark1_background #ebbcba
mark2_foreground #191724
mark2_background #9ccfd8
mark3_foreground #191724
mark3_background #f6c177

# =============================================================================
# Performance
# =============================================================================
repaint_delay   10
input_delay     3
sync_to_monitor yes

# =============================================================================
# Terminal
# =============================================================================
term                  xterm-kitty
shell_integration     enabled
copy_on_select        no
strip_trailing_spaces smart
dim_opacity           0.75
paste_actions         quote-urls-at-prompt,confirm

# =============================================================================
# macOS
# =============================================================================
update_check_interval     0
notify_on_cmd_finish      unfocused 10.0
macos_titlebar_color      background
macos_show_window_title_in all
macos_custom_beam_cursor  no

# =============================================================================
# Tab bar
# =============================================================================
tab_bar_edge              top
tab_bar_margin_width      0.0
tab_bar_style             powerline
tab_powerline_style       round
tab_bar_margin_color      #191724
tab_bar_min_tabs          2
tab_switch_strategy       previous
tab_title_template        " {index} {title} "

active_tab_font_style     bold-italic
inactive_tab_font_style   normal

# =============================================================================
# Theme - Rosé Pine (inlined)
# =============================================================================
foreground               #e0def4
background               #191724
selection_foreground     #e0def4
selection_background     #403d52

cursor                   #524f67
cursor_text_color        #e0def4

url_color                #c4a7e7

active_tab_foreground    #191724
active_tab_background    #31748f
inactive_tab_foreground  #6e6a86
inactive_tab_background  #191724

# Divider borders: kitty draws one border per window, so both colors must
# match for the divider to read as a single thin line (no focus-color cue)
active_border_color      #403d52
inactive_border_color    #403d52

# Color palette
color0   #26233a    color8   #6e6a86
color1   #eb6f92    color9   #eb6f92
color2   #31748f    color10  #31748f
color3   #f6c177    color11  #f6c177
color4   #9ccfd8    color12  #9ccfd8
color5   #c4a7e7    color13  #c4a7e7
color6   #ebbcba    color14  #ebbcba
color7   #e0def4    color15  #e0def4

# =============================================================================
# Key mappings
# =============================================================================

# Clipboard
map cmd+c               copy_to_clipboard
map cmd+v               paste_from_clipboard
# Send Ctrl+_ (0x1f) so zsh/readline undo works with Cmd+Z.
map cmd+z               send_text normal,application \x1f
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard
map ctrl+shift+s        paste_from_selection
map shift+insert        paste_from_selection
# NOTE: ctrl+shift+o is bound to the path-hints kitten further down (the
# previous pass_selection_to_program mapping here was shadowed and dead).

# Scrolling
map ctrl+shift+up        scroll_line_up
map ctrl+shift+down      scroll_line_down
map ctrl+shift+k         scroll_line_up
map ctrl+shift+j         scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down

# Window management
map ctrl+shift+enter    new_window
map ctrl+shift+w        close_window
map ctrl+shift+]        next_window
map ctrl+shift+[        previous_window

# Toad — AI agent pane (right split, inherits cwd)
map ctrl+shift+a        launch --location=vsplit --cwd=current toad

# Reveal any visible file/folder path in Finder (press, then type the
# highlighted letter). Works on paths printed by any program, not just ls.
map ctrl+shift+o        kitten hints --type path --program "open -R"

# Tab management
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+t        new_tab
map ctrl+shift+q        close_tab

# Font size
map ctrl+shift+equal    increase_font_size
map ctrl+shift+minus    decrease_font_size
map ctrl+shift+backspace restore_font_size

# Fullscreen
map ctrl+shift+f11      toggle_fullscreen

# =============================================================================
# Enhancement pack (2026-07-19)
# =============================================================================

# Jump between shell prompts (uses shell-integration marks) — the fast way
# to scroll through long Claude/Kimi output.
map ctrl+shift+z scroll_to_prompt -1
map ctrl+shift+x scroll_to_prompt 1

# Grab a word / git hash from the screen and insert it at the cursor
# (e.g. file names or SHAs mentioned by an AI agent).
map ctrl+shift+e kitten hints --type word --program -
map ctrl+shift+i kitten hints --type hash --program -

# Local-only remote control via unix socket (no network listener). Enables
# kittens/scripts to control this instance, e.g. `kitty @ set-tab-title`.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}