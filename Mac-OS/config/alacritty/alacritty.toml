# ~/.config/alacritty/alacritty.toml — Rosé Pine, aligned with Ghostty/Kitty

[general]
live_config_reload = true

[env]
PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# ── Window ────────────────────────────────────────────────────────────────────

[window]
dimensions    = { columns = 120, lines = 45 }
padding       = { x = 8, y = 8 }
decorations   = "full"
opacity       = 0.85
blur          = true
dynamic_title = true
title         = "Alacritty"

# ── Font ──────────────────────────────────────────────────────────────────────

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style  = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style  = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style  = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style  = "Bold Italic"

# ── Cursor ────────────────────────────────────────────────────────────────────

[cursor]
style             = { shape = "Block", blinking = "Off" }
unfocused_hollow  = true

# ── Scrollback ────────────────────────────────────────────────────────────────

[scrolling]
history    = 100000
multiplier = 5

# ── Mouse ─────────────────────────────────────────────────────────────────────

[mouse]
hide_when_typing = true

# ── Colors: Rosé Pine ─────────────────────────────────────────────────────────

[colors.primary]
background = "#191724"
foreground = "#e0def4"

[colors.cursor]
text   = "#191724"
cursor = "#ffaadf"

[colors.selection]
text       = "#e0def4"
background = "#403d52"

[colors.normal]
black   = "#26233a"
red     = "#eb6f92"
green   = "#31748f"
yellow  = "#f6c177"
blue    = "#9ccfd8"
magenta = "#c4a7e7"
cyan    = "#ebbcba"
white   = "#e0def4"

[colors.bright]
black   = "#6e6a86"
red     = "#eb6f92"
green   = "#31748f"
yellow  = "#f6c177"
blue    = "#9ccfd8"
magenta = "#c4a7e7"
cyan    = "#ebbcba"
white   = "#e0def4"

[colors.footer_bar]
background = "#191724"
foreground = "#e0def4"

[colors.hints.start]
background = "#f6c177"
foreground = "#191724"

[colors.hints.end]
background = "#c4a7e7"
foreground = "#191724"

# ── Key bindings ──────────────────────────────────────────────────────────────

[keyboard]
bindings = [
  # Clipboard
  { key = "C",         mods = "Command",       action = "Copy" },
  { key = "V",         mods = "Command",       action = "Paste" },
  { key = "C",         mods = "Control|Shift", action = "Copy" },
  { key = "V",         mods = "Control|Shift", action = "Paste" },

  # Cmd+Z → Ctrl+_ (0x1f) so zsh/readline undo works
  { key = "Z",         mods = "Command",       chars = "\u001f" },

  # Font size
  { key = "Equals",    mods = "Command",       action = "IncreaseFontSize" },
  { key = "Minus",     mods = "Command",       action = "DecreaseFontSize" },
  { key = "Key0",      mods = "Command",       action = "ResetFontSize" },
  { key = "Equals",    mods = "Control|Shift", action = "IncreaseFontSize" },
  { key = "Minus",     mods = "Control|Shift", action = "DecreaseFontSize" },
  { key = "Back",      mods = "Control|Shift", action = "ResetFontSize" },

  # Scrollback
  { key = "K",         mods = "Control|Shift", action = "ScrollLineUp" },
  { key = "J",         mods = "Control|Shift", action = "ScrollLineDown" },
  { key = "PageUp",    mods = "Control|Shift", action = "ScrollPageUp" },
  { key = "PageDown",  mods = "Control|Shift", action = "ScrollPageDown" },
  { key = "Home",      mods = "Control|Shift", action = "ScrollToTop" },
  { key = "End",       mods = "Control|Shift", action = "ScrollToBottom" },

  # New window (Alacritty has no tabs/splits — use tmux for that)
  { key = "N",         mods = "Command",       action = "CreateNewWindow" },
]
