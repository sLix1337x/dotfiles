# ~/.tmux.conf — Rosé Pine + full addon stack

# ── Terminal ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"
# Required for Claude Code: desktop notifications + progress bar passthrough,
# and Shift+Enter distinction inside tmux.
set -g allow-passthrough on
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Start the non-blocking system-info cache worker (used by status-right).
run-shell "bash ~/.config/tmux/status-sysinfo-worker.sh >/dev/null 2>&1 &"

set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 0
set -g display-panes-time 2500
set -g mouse on
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
setw -g mode-keys vi
set -g default-size 120x45
set -g default-shell /bin/zsh
set -g destroy-unattached off
set -g renumber-windows on
set -g set-titles on
# Window title: current path (with ~ for $HOME) + running program, e.g.
# "~/Code/myapp »  nvim". Session name stays in the status bar.
set -g set-titles-string "#{s|^/Users/[^/]*|~|:pane_current_path} » #W"

# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Rosé Pine colors ─────────────────────────────────────────────────────────
set -g status-style "bg=#191724,fg=#e0def4"
set -g message-style "bg=#26233a,fg=#e0def4"
set -g message-command-style "bg=#7129FF,fg=#FFFFFF"
setw -g pane-border-style "fg=#6e6a86"
setw -g pane-active-border-style "fg=#31748f,bold"
set -g pane-border-lines single
setw -g window-status-style "bg=#191724,fg=#6e6a86"
setw -g window-status-current-style "bg=#26233a,fg=#e0def4,bold"

# Copy-mode selection highlight (red on dark background)
set -g mode-style "bg=#eb6f92,fg=#191724,bold"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-position bottom
# Refresh the status bar every 60 seconds to reduce script/battery overhead.
set -g status-interval 60
set -g status-left-length 40
set -g status-right-length 220
# status-left / status-right are rendered by the rose-pine/tmux plugin (see
# "Rosé Pine theme" section). Custom segments are injected via the theme's
# *_section hooks: the live agent indicator runs on every refresh, everything
# else is consolidated into ONE cached script call. Right-prepend keeps the
# clock at the far right edge.
set -g @rose_pine_status_left_prepend_section '#{prefix_highlight}'
set -g @rose_pine_status_right_prepend_section '#(bash ~/.tmux/plugins/tmux-agent-indicator/scripts/indicator.sh)#($HOME/.config/tmux/status-right-compact.sh "#{pane_current_path}")#[fg=#6e6a86] | '

# ── Rosé Pine theme (powerline status bar, matches Kitty tabs) ───────────────
set -g @rose_pine_variant 'main'
set -g @rose_pine_host 'off'
set -g @rose_pine_user 'off'
set -g @rose_pine_directory 'off'
set -g @rose_pine_date_time ''

# Per-pane title strip: index, running program, cwd — spot Claude/Kimi/server
# panes at a glance (border colors still come from tmux-agent-indicator).
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#9ccfd8,bold],#[fg=#6e6a86]} #P #{pane_current_command} · #{b:pane_current_path} "

# ── Prefix highlight ─────────────────────────────────────────────────────────
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_fg 'black'
set -g @prefix_highlight_bg '#f6c177'
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=#c4a7e7'

# ── Online / battery icons ───────────────────────────────────────────────────
set -g @offline_icon '#[fg=#eb6f92]●'
set -g @online_icon '#[fg=#9ccfd8]●'

# ── Yank ─────────────────────────────────────────────────────────────────────
# Copy and exit copy mode for a clean, fast workflow.
set -g @yank_action 'copy-pipe-and-cancel'

# ── Fuzzback / sessionx ──────────────────────────────────────────────────────
set -g @fuzzback-bind '/'
set -g @sessionx-bind 'o'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-window-width '75%'
set -g @sessionx-window-height '75%'
set -g @sessionx-fzf-builtin-tmux 'on'

# ── Thumbs ───────────────────────────────────────────────────────────────────
set -g @thumbs-key 'T'
set -g @thumbs-osc52 'enabled'
set -g @thumbs-unique 'enabled'

# ── Power zoom ───────────────────────────────────────────────────────────────
set -g @power_zoom_trigger 'P'

# ── Floax — persistent floating popup pane (prefix + p) ──────────────────────
# previous-window moves from p to C-p so Floax can use p.
# Floax's settings menu moves to M-F so Power Zoom keeps capital P.
bind C-p previous-window
set -g @floax-bind 'p'
set -g @floax-bind-menu 'M-F'
set -g @floax-width '85%'
set -g @floax-height '85%'

# ── Agent indicator ──────────────────────────────────────────────────────────
set -g @agent-indicator-border-enabled 'on'
set -g @agent-indicator-reset-on-focus 'on'
set -g @agent-indicator-animation-enabled 'on'
set -g @agent-indicator-animation-speed '450'
# Detect Kimi CLI sessions too (🌙 next to Claude's 🤖).
set -g @agent-indicator-processes 'claude,codex,aider,cursor,opencode,kimi'
set -g @agent-indicator-icons 'claude=🤖,codex=🧠,opencode=💻,kimi=🌙,default=🤖'

# Rose Pine state colors (gold = needs input, foam = done)
set -g @agent-indicator-needs-input-border '#f6c177'
set -g @agent-indicator-needs-input-window-title-bg '#f6c177'
set -g @agent-indicator-needs-input-window-title-fg '#191724'
set -g @agent-indicator-done-border '#9ccfd8'
set -g @agent-indicator-done-window-title-bg '#9ccfd8'
set -g @agent-indicator-done-window-title-fg '#191724'

# ── Resurrect + Continuum ────────────────────────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'
# Auto-save every 15 min and restore the last session when tmux starts.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# ── Nerd font window names ───────────────────────────────────────────────────
# Config file: ~/.config/tmux/tmux-nerd-font-window-name.yml

# ── Custom key bindings (after plugins load via TPM) ─────────────────────────

# Replace tmux-click-copy's broken leftover bindings with standard
# double/triple-click word/line selection that copies to the clipboard.
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; send-keys -X select-word ; send-keys -X copy-pipe-and-cancel pbcopy"
bind -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H ; send-keys -X select-line ; send-keys -X copy-pipe-and-cancel pbcopy"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel pbcopy
bind -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel pbcopy
bind -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel pbcopy

# Mouse drag: copy selection on release and exit copy mode immediately.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy

bind C-h display-popup -E -d "#{pane_current_path}" -h "90%" -w "75%" nvim-cheatsheet
bind C-j display-popup -E -d "#{pane_current_path}" -h "85%" -w "85%" \
  "$HOME/.tmux/plugins/tmux-claude-sessions/scripts/claude-sessions"
bind C-r display-popup -E -d "#{pane_current_path}" -h "85%" -w "85%" \
  "$HOME/.tmux/plugins/tmux-claude-sessions/scripts/claude-sessions --in-place"
bind C-s run-shell "$HOME/.tmux/plugins/tmux-resurrect/scripts/save.sh"

bind G run-shell "$HOME/.tmux/plugins/kmux-status/scripts/pane_command.sh"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits and new windows that inherit cwd
bind c new-window -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind T split-window -h -c '#{pane_current_path}' 'toad'
bind M split-window -h -c '#{pane_current_path}' 'claude-monitor'

# Right-click pane menu (dev servers)
bind -T root MouseDown3Pane display-menu \
  -T "#[fg=#9ccfd8,bold] ⠿ Pane " \
  "󰆏  Copy Mode"          c  "copy-mode" \
  "󰅋  Paste"              v  "paste-buffer -p" \
  "  Search Scrollback"  s  "command-prompt -p 'Search:' 'copy-mode ; send-keys -X search-backward \"%%\"'" \
  '' \
  "  Rename Window"      r  "command-prompt -I '#W' 'rename-window %%'" \
  "←  Move Left"          "<" "swap-window -t -1; select-window -t -1" \
  "→  Move Right"         ">" "swap-window -t +1; select-window -t +1" \
  '' \
  "  Save Session"       S  "run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'" \
  "  Restore Session"    R  "run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'" \
  '' \
  "󰒍  List Servers"       l  "display-popup -E '$HOME/.config/tmux/list-servers.sh'" \
  "  Kill Server..."     k  "command-prompt -p 'Kill server on port:' 'display-popup -E \"$HOME/.config/tmux/kill-server.sh %%\"'" \
  "  Kill All Servers"   K  "display-popup -E '$HOME/.config/tmux/kill-dev-servers.sh'" \
  '' \
  "  New Tab"            t  "run-shell '~/.config/tmux/new-ghostty-tab.sh'" \
  "  New Window"         n  "new-window -c '#{pane_current_path}'" \
  "  Split Right"        h  "split-window -h -c '#{pane_current_path}'" \
  "  Split Down"         j  "split-window -v -c '#{pane_current_path}'" \
  "⛶  Zoom Pane"          z  "resize-pane -Z" \
  "󰩇  Clear Scrollback"   C  "clear-history" \
  '' \
  "  Close Pane"         x  "kill-pane" \
  "  Close Window"       X  "kill-window" \
  "󰍃  Detach"             d  "detach-client"

bind r source-file ~/.tmux.conf \; display "Reloaded"

# ── TPM plugins (keep tpm last before run) ───────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'roosta/tmux-fuzzback'
# Disable activity marks in the status bar — they clutter the clean workflow.
set -g monitor-activity off
set -g visual-activity off

set -g @plugin 'rickstaa/tmux-notify'
# ── Notify ───────────────────────────────────────────────────────────────────
# prefix + m  -> monitor current pane and notify when it finishes
# prefix + M  -> cancel monitoring
set -g @tnotify-verbose 'on'
set -g @tnotify-verbose-title 'Tmux task finished'
set -g @tnotify-verbose-msg 'Session: #S | Window: #W | Pane: #P'
set -g @tnotify-sleep-duration '5'
set -g @plugin 'jaclu/tmux-power-zoom'
set -g @plugin 'accessd/tmux-agent-indicator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'alicansalor/tmux-claude-sessions'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tardunge/kmux-status'
# Powerline Rosé Pine status bar (configured in "Rosé Pine theme" above).
set -g @plugin 'rose-pine/tmux'
# Auto-save/restore sessions (options in "Resurrect + Continuum" above).
set -g @plugin 'tmux-plugins/tmux-continuum'
# Fuzzy-grab any text from any pane (prefix + tab) — complements thumbs.
set -g @plugin 'laktak/extrakto'
# Persistent floating popup pane (prefix + p, configured above).
set -g @plugin 'omerxx/tmux-floax'
# Claude session manager TUI (prefix + C-\) — binary at ~/.local/bin/lazyclaude.
set -g @plugin 'any-context/lazyclaude'

run '~/.tmux/plugins/tpm/tpm'

# Override nerd-font-window-name's format: map version-like process names → "Claude Code"
run-shell "bash ~/.config/tmux/window-rename-format.sh"

# Blue background for left status — must come after TPM so it overrides rose-pine/tmux
set -g status-left "#[bg=#1A7FD4,fg=#191724,bold] #S #[bg=default,fg=#1A7FD4] "

# ── Styled window tabs (active = blue #1A7FD4) ──────────────────────────────
setw -g window-status-format " #[fg=#6e6a86]#I  #W "
setw -g window-status-current-format "#[fg=#1A7FD4,bg=default]#[bg=#1A7FD4,fg=#191724,bold] #I  #W #[bg=default,fg=#1A7FD4]"

# ── Second status bar above: date + teal clock block on the right ────────────
set -g status 2
set -g status-format[1] "#[fill=#191724]#[fg=#c4a7e7,bold]  #{s|^/Users/[^/]*|~|:pane_current_path} #[align=right,fg=#6e6a86] %a, %b %d  #[fg=#9ccfd8,bg=default]#[bg=#9ccfd8,fg=#191724,bold]  %H:%M #[bg=default,fg=#9ccfd8] "
